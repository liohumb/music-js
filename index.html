<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <title>Pointeur musical — synthwave</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            html, body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #0a0e1a;
                touch-action: none;
                user-select: none;
                -webkit-user-select: none;
                -webkit-tap-highlight-color: transparent;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }
            
            #scene {
                display: block;
                width: 100%;
                height: 100%;
            }
            
            #hint {
                position: fixed;
                top: 22px;
                left: 0;
                right: 0;
                text-align: center;
                font-size: 13px;
                letter-spacing: 0.08em;
                color: rgba(150, 170, 210, 0.35);
                pointer-events: none;
                transition: opacity 1.2s ease;
            }
            
            #bgtext {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0 6vw;
                text-align: center;
                font-size: clamp(34px, 11vw, 120px);
                font-weight: 700;
                letter-spacing: 0.03em;
                color: rgba(150, 170, 210, 0.06); /* très discret, comme une ombre */
                pointer-events: none;
                user-select: none;
                transition: opacity 1.4s ease;
                z-index: 1;
            }
            
            #panel {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
                background: rgba(10, 14, 26, 0.55);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-top: 1px solid rgba(120, 140, 200, 0.10);
                touch-action: auto;
                z-index: 10;
            }
            
            .controls {
                flex: 1;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 14px 22px;
            }
            
            .ctl {
                display: flex;
                flex-direction: column;
                gap: 6px;
                align-items: center;
            }
            
            .lbl {
                font-size: 9px;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: rgba(150, 170, 210, 0.45);
            }
            
            #panel input[type="range"] {
                width: 108px;
                height: 18px;
                touch-action: auto;
                accent-color: #ff4fa3;
                cursor: pointer;
                background: transparent;
            }
            
            .waves {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .waves button {
                font: inherit;
                font-size: 10px;
                letter-spacing: 0.05em;
                padding: 5px 8px;
                border-radius: 6px;
                cursor: pointer;
                color: rgba(180, 195, 225, 0.55);
                background: rgba(120, 140, 200, 0.06);
                border: 1px solid rgba(120, 140, 200, 0.14);
                transition: all 0.18s ease;
            }
            
            .waves button.on {
                color: #ffd9ec;
                background: rgba(255, 79, 163, 0.18);
                border-color: rgba(255, 79, 163, 0.55);
            }
            
            #gh {
                display: inline-flex;
                align-self: center;
                color: rgba(150, 170, 210, 0.40);
                -webkit-tap-highlight-color: transparent;
                transition: color 0.2s ease, transform 0.2s ease;
            }
            
            #gh:hover {
                color: rgba(225, 235, 255, 0.92);
                transform: translateY(-1px);
            }
        </style>
    </head>
    
    <body>
        <canvas id="scene"></canvas>
        <div id="bgtext">Touche pour jouer</div>
        <p id="hint">Touche et glisse pour jouer</p>
        
        <div id="panel">
            <div class="controls">
                <div class="ctl">
                    <span class="lbl">Instrument</span>
                    <div class="waves">
                        <button data-preset="piano" class="on">PIANO</button>
                        <button data-preset="guitare">GUITARE</button>
                        <button data-preset="flute">FLÛTE</button>
                        <button data-preset="basse">BASSE</button>
                        <button data-preset="lead">LEAD</button>
                    </div>
                </div>
                <div class="ctl">
                    <span class="lbl">Cutoff</span>
                    <input id="cutoff" type="range" min="400" max="6000" value="2400" aria-label="Cutoff du filtre">
                </div>
                <div class="ctl">
                    <span class="lbl">Écho</span>
                    <input id="echo" type="range" min="0" max="100" value="40" aria-label="Niveau d'écho">
                </div>
                <div class="ctl">
                    <span class="lbl">Réverb</span>
                    <input id="reverb" type="range" min="0" max="100" value="45" aria-label="Niveau de réverbération">
                </div>
            </div>
            <a id="gh" href="https://github.com/liohumb/music-js" target="_blank" rel="noopener" aria-label="Voir le code sur GitHub">
                <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
            </a>
        </div>
        
        <script>
            'use strict'
            
            /* CONFIGURATION : constantes nommées, aucun magic number */
            // Gamme pentatonique majeure sur 2 octaves (do, ré, mi, sol, la), grave -> aigu.
            const SCALE = [
                261.63, 293.66, 329.63, 392.00, 440.00,
                523.25, 587.33, 659.25, 783.99, 880.00
            ]
            
            const MAX_GAIN = 0.16   // volume max d'une voix (mis à l'échelle par chaque instrument)
            
            const DELAY_TIME = 0.33   // durée de l'écho (s) — répétition « pointée » synthwave
            const DELAY_FEEDBACK = 0.38   // réinjection de l'écho sur lui-même
            const REVERB_SECONDS = 2.6    // longueur de la queue de réverbération
            const REVERB_DECAY = 3.0    // vitesse d'extinction de la réverb
            const MASTER_GAIN = 0.9    // niveau général avant compression
            
            const TRACE_FADE = 0.08   // opacité du voile sombre par frame (fondu des traces)
            const TRACE_WIDTH = 14     // épaisseur du halo lumineux
            const HINT_HIDE_MS = 2600   // délai avant d'estomper l'instruction
            
            // Paramètres modifiables en direct par les contrôles (valeurs de départ synthwave).
            const params = { preset: 'piano', cutoff: 2400, echo: 0.40, reverb: 0.45 }
            
            /* AUDIO : Web Audio API native (voix + bus d'effets partagé) */
            let audioCtx = null
            const voices = new Map()      // pointerId -> { oscs, filter, env, vol, tune, r, gainScale }
            
            // Nœuds globaux du bus d'effets (créés une seule fois au premier geste).
            let fxInput, master, delayWet, reverbWet
            const waves = {}              // ondes additives réutilisables (piano, guitare)
            
            // Génère une réponse impulsionnelle de réverb : bruit qui décroît exponentiellement.
            function makeReverbIR() {
                const rate = audioCtx.sampleRate
                const length = Math.floor( rate * REVERB_SECONDS )
                const ir = audioCtx.createBuffer( 2, length, rate )
                for ( let ch = 0; ch < 2; ch++ ) {
                    const data = ir.getChannelData( ch )
                    for ( let i = 0; i < length; i++ ) {
                        data[i] = (Math.random() * 2 - 1) * Math.pow( 1 - i / length, REVERB_DECAY )
                    }
                }
                return ir
            }
            
            // Construit le graphe d'effets : voix -> fxInput -> (dry + écho + réverb) -> compresseur.
            function buildGraph() {
                master = audioCtx.createGain()
                master.gain.value = MASTER_GAIN
                const comp = audioCtx.createDynamicsCompressor() // protège des pics en multi-touch
                master.connect( comp ).connect( audioCtx.destination )
                
                fxInput = audioCtx.createGain()
                fxInput.connect( master )                          // signal direct (dry)
                
                // Écho : delay rebouclé sur lui-même via un gain de feedback.
                const delay = audioCtx.createDelay()
                delay.delayTime.value = DELAY_TIME
                const feedback = audioCtx.createGain()
                feedback.gain.value = DELAY_FEEDBACK
                delayWet = audioCtx.createGain()
                delayWet.gain.value = params.echo
                fxInput.connect( delay )
                delay.connect( feedback ).connect( delay )
                delay.connect( delayWet ).connect( master )
                
                // Réverbération par convolution sur l'impulsion générée plus haut.
                const convolver = audioCtx.createConvolver()
                convolver.buffer = makeReverbIR()
                reverbWet = audioCtx.createGain()
                reverbWet.gain.value = params.reverb
                fxInput.connect( convolver ).connect( reverbWet ).connect( master )
                
                // Ondes additives : piano (doux) et guitare nylon (fondamentale dominante, aigus en retrait).
                waves.piano = periodicWave( [1, 0.55, 0.4, 0.28, 0.18, 0.12, 0.07, 0.04] )
                waves.guitar = periodicWave( [1, 0.6, 0.35, 0.2, 0.1, 0.05, 0.02] )
            }
            
            // Déverrouille l'AudioContext au premier user gesture et construit le graphe.
            function unlockAudio() {
                if ( !audioCtx ) {
                    audioCtx = new (window.AudioContext || window['webkitAudioContext'])()
                    buildGraph()
                }
                if ( audioCtx.state === 'suspended' ) audioCtx.resume()
            }
            
            // X normalisé [0..1] -> fréquence quantifiée sur la gamme (grave à gauche).
            function xToFreq(nx) {
                return SCALE[Math.min( SCALE.length - 1, Math.floor( nx * SCALE.length ) )]
            }
            
            // Y normalisé [0..1] -> volume (haut = silence, bas = fort).
            function yToGain(ny) { return ny * MAX_GAIN }
            
            // Petits raccourcis de construction des oscillateurs et du filtre.
            const NOW = () => audioCtx.currentTime
            
            // type = chaîne ("sine"...) OU une PeriodicWave (timbre additif sur mesure).
            function makeOsc(type, freq, detune) {
                const o = audioCtx.createOscillator()
                if ( typeof type === 'string' ) { o.type = type } else { o.setPeriodicWave( type ) }
                o.frequency.value = freq
                if ( detune ) o.detune.value = detune
                return o
            }
            
            function lowpass(cutoff, q) {
                const f = audioCtx.createBiquadFilter()
                f.type = 'lowpass'
                f.frequency.value = cutoff
                f.Q.value = q
                return f
            }
            
            // Construit une onde additive à partir d'amplitudes d'harmoniques (fondamental, 2e, 3e...).
            function periodicWave(harmonics) {
                const real = new Float32Array( harmonics.length + 1 )
                const imag = new Float32Array( harmonics.length + 1 )
                harmonics.forEach( (amp, i) => { imag[i + 1] = amp } )
                return audioCtx.createPeriodicWave( real, imag )
            }
            
            const PRESETS = {
                // PIANO : deux « cordes » désaccordées (battement chaleureux), déclin long, filtre tout doux.
                piano: {
                    cutoff: 2400, gain: 0.9, env: { a: 0.003, d: 3.5, s: 0.04, r: 0.3 },
                    build(freq) {
                        const now = NOW()
                        const a = makeOsc( waves.piano, freq, -2.5 ), b = makeOsc( waves.piano, freq, 2.5 )
                        const filter = lowpass( params.cutoff * 1.6, 0.7 )
                        // Le brillant retombe doucement, sans « twang » : le piano résonne longtemps.
                        filter.frequency.setValueAtTime( params.cutoff * 1.6, now )
                        filter.frequency.exponentialRampToValueAtTime( params.cutoff * 0.8, now + 1.5 )
                        a.connect( filter )
                        b.connect( filter )
                        return {
                            oscs: [a, b], filter,
                            tune: (hz) => {
                                a.frequency.setTargetAtTime( hz, NOW(), 0.02 )
                                b.frequency.setTargetAtTime( hz, NOW(), 0.02 )
                            }
                        }
                    }
                },
                // FLÛTE : sinus quasi pur, souffle aérien (harmonique d'octave discret) et vibrato expressif.
                flute: {
                    cutoff: 2500, gain: 1.0, env: { a: 0.08, d: 0, s: 1, r: 0.25 },
                    build(freq) {
                        const o = makeOsc( 'sine', freq )
                        const air = makeOsc( 'sine', freq * 2, 4 )          // souffle = octave très discrète
                        const airGain = audioCtx.createGain()
                        airGain.gain.value = 0.12
                        const filter = lowpass( params.cutoff, 0.7 )
                        o.connect( filter )
                        air.connect( airGain ).connect( filter )
                        const lfo = makeOsc( 'sine', 5.0 )
                        const lfoGain = audioCtx.createGain()
                        lfoGain.gain.value = 11 // vibrato (cents)
                        lfo.connect( lfoGain )
                        lfoGain.connect( o.detune )
                        lfoGain.connect( air.detune )
                        return {
                            oscs: [o, air, lfo], filter,
                            tune: (hz) => {
                                o.frequency.setTargetAtTime( hz, NOW(), 0.03 )
                                air.frequency.setTargetAtTime( hz * 2, NOW(), 0.03 )
                            }
                        }
                    }
                },
                // GUITARE NYLON : accord majeur plaqué sur 3 cordes (type barré), timbre doux et boisé, strum descendant.
                guitare: {
                    cutoff: 1400, gain: 0.6, env: { a: 0.01, d: 1.4, s: 0.06, r: 0.3 },
                    build(freq) {
                        const now = NOW()
                        const RATIOS = [1, 1.2599, 1.4983] // triade majeure : fondamentale, tierce M (+4), quinte (+7)
                        const STRUM = 0.022                // décalage entre cordes -> coup de médiator (grave -> aigu)
                        // Brillance douce du grattage qui retombe vite vers un son chaud de nylon.
                        const filter = lowpass( params.cutoff * 1.8, 0.8 )
                        filter.frequency.setValueAtTime( params.cutoff * 1.8, now )
                        filter.frequency.exponentialRampToValueAtTime( params.cutoff * 0.8, now + 0.25 )
                        const oscs = RATIOS.map( (ratio, k) => {
                            const o = makeOsc( waves.guitar, freq * ratio )
                            const strum = audioCtx.createGain()   // attaque décalée corde par corde
                            strum.gain.setValueAtTime( 0, now )
                            strum.gain.linearRampToValueAtTime( 1, now + k * STRUM + 0.008 )
                            o.connect( strum ).connect( filter )
                            return o
                        } )
                        return {
                            oscs, filter,
                            tune: (hz) => oscs.forEach( (o, k) => o.frequency.setTargetAtTime( hz * RATIOS[k], NOW(), 0.03 ) )
                        }
                    }
                },
                // BASSE SYNTHÉ : registre grave (2 octaves plus bas), dent de scie ronde et résonante.
                basse: {
                    cutoff: 700, gain: 1.2, env: { a: 0.01, d: 0, s: 1, r: 0.15 },
                    build(freq) {
                        const f = freq * 0.25                       // deux octaves sous la gamme -> vraie basse
                        const a = makeOsc( 'sawtooth', f ), b = makeOsc( 'sawtooth', f, 8 )
                        const filter = lowpass( params.cutoff, 4 )    // filtre bas + résonance = rondeur synthé
                        a.connect( filter )
                        b.connect( filter )
                        return {
                            oscs: [a, b], filter,
                            tune: (hz) => {
                                a.frequency.setTargetAtTime( hz * 0.25, NOW(), 0.02 )
                                b.frequency.setTargetAtTime( hz * 0.25, NOW(), 0.02 )
                            }
                        }
                    }
                },
                // LEAD SYNTHWAVE : 2 dents de scie désaccordées « fat », filtre résonant qui chante.
                lead: {
                    cutoff: 2400, gain: 1.0, env: { a: 0.03, d: 0, s: 1, r: 0.45 },
                    build(freq) {
                        const a = makeOsc( 'sawtooth', freq ), b = makeOsc( 'sawtooth', freq, 9 )
                        const filter = lowpass( params.cutoff, 3.4 )
                        a.connect( filter )
                        b.connect( filter )
                        return {
                            oscs: [a, b], filter,
                            tune: (hz) => {
                                a.frequency.setTargetAtTime( hz, NOW(), 0.02 )
                                b.frequency.setTargetAtTime( hz, NOW(), 0.02 )
                            }
                        }
                    }
                }
            }
            
            // Démarre une voix selon le patch courant : [patch] -> enveloppe -> volume(Y) -> bus.
            function startVoice(id, nx, ny) {
                const now = audioCtx.currentTime
                const preset = PRESETS[params.preset]
                const v = preset.build( xToFreq( nx ) )
                
                const env = audioCtx.createGain()   // forme de l'enveloppe d'amplitude (0..1)
                const vol = audioCtx.createGain()   // volume piloté par la position Y
                v.filter.connect( env ).connect( vol ).connect( fxInput )
                
                // Attaque, puis éventuel decay vers le niveau de maintien (sustain).
                const e = preset.env
                env.gain.setValueAtTime( 0.0001, now )
                env.gain.linearRampToValueAtTime( 1, now + e.a )
                if ( e.d ) env.gain.linearRampToValueAtTime( Math.max( e.s, 0.0001 ), now + e.a + e.d )
                vol.gain.value = yToGain( ny ) * preset.gain
                
                v.oscs.forEach( (o) => o.start( now ) )
                v.env = env
                v.vol = vol
                v.r = e.r
                v.gainScale = preset.gain
                voices.set( id, v )
            }
            
            // Met à jour une voix qui glisse : note (tune) et volume Y, avec rampes anti-clic.
            function updateVoice(id, nx, ny) {
                const v = voices.get( id )
                if ( !v ) return
                v.tune( xToFreq( nx ) )
                v.vol.gain.setTargetAtTime( yToGain( ny ) * v.gainScale, audioCtx.currentTime, 0.03 )
            }
            
            // Relâche une voix : release de l'enveloppe puis arrêt de tous les oscillateurs.
            function stopVoice(id) {
                const v = voices.get( id )
                if ( !v ) return
                const now = audioCtx.currentTime
                v.env.gain.cancelScheduledValues( now )
                v.env.gain.setValueAtTime( v.env.gain.value, now )
                v.env.gain.linearRampToValueAtTime( 0.0001, now + v.r )
                v.oscs.forEach( (o) => o.stop( now + v.r + 0.05 ) )
                voices.delete( id )
            }
            
            /* VISUEL : canvas plein écran, traces lumineuses synthwave */
            const canvas = document.getElementById( 'scene' )
            const ctx = canvas.getContext( '2d' )
            const trails = new Map()      // pointerId -> { x, y } dernière position connue
            
            // Adapte le canvas à l'écran et à la densité de pixels (Retina).
            function resize() {
                const dpr = window.devicePixelRatio || 1
                canvas.width = window.innerWidth * dpr
                canvas.height = window.innerHeight * dpr
                ctx.setTransform( dpr, 0, 0, dpr, 0, 0 )
            }
            
            window.addEventListener( 'resize', resize )
            resize()
            
            // Couleur selon X : grave = magenta profond, aigu = cyan — palette synthwave.
            function traceColor(nx) {
                const hue = 320 - nx * 140 // 320 (magenta) -> 180 (cyan)
                return `hsl(${hue}, 95%, 62%)`
            }
            
            // Boucle de rendu : voile sombre (fondu) puis halos lumineux flous.
            function render() {
                ctx.fillStyle = `rgba(10, 14, 26, ${TRACE_FADE})`
                ctx.fillRect( 0, 0, canvas.width, canvas.height )
                for ( const [, p] of trails ) {
                    const color = traceColor( p.x / window.innerWidth )
                    ctx.beginPath()
                    ctx.arc( p.x, p.y, TRACE_WIDTH, 0, Math.PI * 2 )
                    ctx.fillStyle = color
                    ctx.shadowBlur = TRACE_WIDTH * 2.2
                    ctx.shadowColor = color
                    ctx.fill()
                }
                ctx.shadowBlur = 0
                requestAnimationFrame( render )
            }
            
            requestAnimationFrame( render )
            
            /* CONTRÔLES : réglages discrets appliqués en temps réel */
            
            // Patch sonore : s'applique aux prochaines notes et cale le Cutoff sur le caractère du son.
            const cutoffSlider = document.getElementById( 'cutoff' )
            document.querySelectorAll( '.waves button' ).forEach( (btn) => {
                btn.addEventListener( 'pointerdown', (e) => {
                    e.preventDefault()
                    params.preset = btn.dataset.preset
                    document.querySelectorAll( '.waves button' ).forEach( (b) => b.classList.toggle( 'on', b === btn ) )
                    params.cutoff = PRESETS[params.preset].cutoff
                    cutoffSlider.value = params.cutoff
                } )
            } )
            
            // Cutoff du filtre : mis à jour sur toutes les voix actives.
            document.getElementById( 'cutoff' ).addEventListener( 'input', (e) => {
                params.cutoff = +e.target.value
                if ( audioCtx ) voices.forEach( (v) => v.filter.frequency.setTargetAtTime( params.cutoff, audioCtx.currentTime, 0.02 ) )
            } )
            // Écho et réverb : on agit directement sur les gains « wet » du bus partagé.
            document.getElementById( 'echo' ).addEventListener( 'input', (e) => {
                params.echo = e.target.value / 100 * 0.5
                if ( delayWet ) delayWet.gain.value = params.echo
            } )
            document.getElementById( 'reverb' ).addEventListener( 'input', (e) => {
                params.reverb = e.target.value / 100 * 0.8
                if ( reverbWet ) reverbWet.gain.value = params.reverb
            } )
            
            /* ÉVÉNEMENTS : Pointer Events uniquement, multi-touch */
            const hint = document.getElementById( 'hint' )
            const bgtext = document.getElementById( 'bgtext' )
            
            // Estompe les deux textes d'invitation (au premier toucher comme après inactivité).
            function hideIntro() {
                hint.style.opacity = '0'
                bgtext.style.opacity = '0'
            }
            
            canvas.addEventListener( 'pointerdown', (e) => {
                e.preventDefault()
                unlockAudio()
                hideIntro()
                startVoice( e.pointerId, e.clientX / window.innerWidth, e.clientY / window.innerHeight )
                trails.set( e.pointerId, { x: e.clientX, y: e.clientY } )
            } )
            
            canvas.addEventListener( 'pointermove', (e) => {
                if ( !voices.has( e.pointerId ) ) return
                e.preventDefault()
                updateVoice( e.pointerId, e.clientX / window.innerWidth, e.clientY / window.innerHeight )
                trails.set( e.pointerId, { x: e.clientX, y: e.clientY } )
            } )
            
            // Fin du contact (relâchement, sortie d'écran, annulation) : on coupe la voix.
            function release(e) {
                if ( !voices.has( e.pointerId ) ) return
                e.preventDefault()
                stopVoice( e.pointerId )
                trails.delete( e.pointerId )
            }
            
            canvas.addEventListener( 'pointerup', release )
            canvas.addEventListener( 'pointercancel', release )
            canvas.addEventListener( 'pointerout', release )
            
            // Les invitations s'effacent d'elles-mêmes après un moment, même sans interaction.
            setTimeout( hideIntro, HINT_HIDE_MS )
